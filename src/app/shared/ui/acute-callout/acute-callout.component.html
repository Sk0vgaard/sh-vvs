<aside
  class="flex h-full items-center rounded-md border border-amber-300 bg-amber-50 px-2.5 py-2 text-amber-950"
  role="note"
>
  <div class="flex items-center gap-2">
    <fa-icon icon="phone" class="size-3.5 shrink-0" />
    <p class="text-xs font-semibold leading-snug sm:text-sm">
      {{ headline() }}
      <br />
      <a [href]="phoneHref()" class="font-semibold text-brand hover:underline">{{ callToAction() }}</a>
      {{ note() }}
    </p>
  </div>
</aside>
