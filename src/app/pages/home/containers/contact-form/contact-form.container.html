<article [id]="SectionIds.Contact" class="hero-form-card" aria-labelledby="contact-form-heading">
  <header class="shrink-0">
    <p class="eyebrow">Kontakt</p>
    <h2 id="contact-form-heading" class="mt-1 text-h3 text-ink-900">Skriv til os</h2>
    <p class="mt-1 text-sm text-ink-600">{{ responsePromise }}</p>
  </header>

  @if (successMessage(); as success) {
    <div class="flex flex-1 items-center justify-center py-6" role="status">
      <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-4 text-emerald-950">
        <p class="font-semibold">{{ success }}</p>
      </div>
    </div>
  } @else {
    <sh-contact-form
      [contactForm]="contactForm"
      [subjects]="subjects"
      [fileError]="fileError()"
      [selectedImageNames]="selectedImageNames()"
      [imageHelp]="imageHelp"
      [submitting]="submitting()"
      [submitDisabled]="submitDisabled()"
      [validationSummary]="validationSummary()"
      [errorMessage]="errorMessage()"
      (filesSelected)="onFilesSelected($event)"
      (submitForm)="onSubmit($event)"
    >
      <sh-acute-callout
        [title]="acuteTitle"
        [phoneHref]="contact.phoneHref"
        [phoneLabel]="'Ring ' + contact.phoneLabel"
      />
    </sh-contact-form>
  }
</article>
